name: Composio catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:composio-catalog
        env:
          WEBAGENT_COMPOSIO_API_KEY: ${{ secrets.WEBAGENT_COMPOSIO_API_KEY }}
